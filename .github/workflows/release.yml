name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate and package (dry run; no GitHub Release is created)'
        required: true
        default: '0.1.0-rc1'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${TAG#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo 'Expected vX.Y.Z or vX.Y.Z-rcN tag (without v for a dry run)' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release-version: ${{ needs.version.outputs.version }}
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: plugin-java-17
          path: dist
      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$TAG" == *-rc* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/daocloud-amamba.hpi dist/SHA256SUMS
